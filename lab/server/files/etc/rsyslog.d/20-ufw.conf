# ulogd's lines, rewritten as the kernel would write them, into the file UFW uses.
template(name="LabUfw" type="string" string="%TIMESTAMP:::date-rfc3339% %HOSTNAME% kernel: %msg%\n")
if $programname == 'ulogd' then {
  if $msg contains '[UFW BLOCK]' then {
    action(type="omfile" file="/var/log/ufw.log" template="LabUfw" fileOwner="syslog" fileGroup="adm" fileCreateMode="0640")
  }
  stop
}
