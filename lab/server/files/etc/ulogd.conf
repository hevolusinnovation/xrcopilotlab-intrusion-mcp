# The packets the lab firewall drops (NFLOG group 1), printed like the kernel LOG target and sent to syslog.
[global]
logfile="syslog"
loglevel=3
plugin="/usr/lib/@MULTIARCH@/ulogd/ulogd_inppkt_NFLOG.so"
plugin="/usr/lib/@MULTIARCH@/ulogd/ulogd_raw2packet_BASE.so"
plugin="/usr/lib/@MULTIARCH@/ulogd/ulogd_filter_IFINDEX.so"
plugin="/usr/lib/@MULTIARCH@/ulogd/ulogd_filter_IP2STR.so"
plugin="/usr/lib/@MULTIARCH@/ulogd/ulogd_filter_PRINTPKT.so"
plugin="/usr/lib/@MULTIARCH@/ulogd/ulogd_output_SYSLOG.so"
stack=log1:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,print1:PRINTPKT,sys1:SYSLOG

[log1]
group=1

[sys1]
facility=LOG_KERN
level=LOG_WARNING
