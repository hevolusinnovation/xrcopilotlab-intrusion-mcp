# lab-01 has four interfaces (one per lab network) and no default route: Suricata listens on all of them (pcap "any")
# instead of the one interface install.sh --with suricata configures on a customer's server.
# -k none: on "any" (loopback, veth) the kernel leaves checksums to the NIC, and every packet would look invalid.
[Service]
ExecStart=
ExecStart=/usr/bin/suricata --pcap=any -k none -c /etc/suricata/suricata.yaml --pidfile /run/suricata.pid --user suricata --group suricata
